name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-alarm-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: نسخه ۱.۰.۳ - داده واقعی در همه بخش‌ها (سخت‌افزار، حافظه، پردازش‌ها، پخش ویدیو و زوم)
          body: |
            ## 🔋 نسخه ۱.۰.۳ (Version Code: 4) — داده واقعی در همه بخش‌ها

            این نسخه تمام بخش‌های «بدون داده» گزارش‌شده را با API واقعی اندروید رفع می‌کند:

            ### 🧠 بخش سخت‌افزار (دما / بار / فرکانس پردازنده)
            - **دمای پردازنده:** اسکن همه thermal zones و انتخاب zone واقعی CPU/SOC از روی type (قبلاً فقط zone0 که اغلب باتری است)
            - **فرکانس کاری:** خواندن همیشگی curFreq/maxFreq همه هسته‌ها + fallback scaling_max_freq + تازه‌سازی هر ۴ ثانیه (قبلاً برای همیشه «—» می‌ماند)
            - **بار کل پردازنده:** jiffies دقیق + تخمین صادقانه از loadavg در نمونه اول

            ### 💾 حافظه داخلی واقعی
            - اندازه‌گیری ۴ کاندید (/data، /storage/emulated/0، ...) و گزارش بزرگ‌ترین = حافظه واقعی کاربر + نمایش منبع + پارتیشن‌های مجزا (SD/USB) + جزئیات MemFree/MemAvailable رم

            ### 🧩 پردازش‌های فعال + بهینه‌سازی
            - بازنویسی کامل: از اندروید ۸ لیست پردازش‌های سیستم در دسترس برنامه‌ها نیست؛ حالا برنامه‌های واقعاً فعال (UsageStats) با حجم واقعی کد+داده/کش (StorageStats) و زمان آخرین فعالیت گزارش می‌شوند — بدون هیچ عدد جعلی
            - پاکسازی: گزارش واقعی اندازه فایل‌های کش پاک‌شده (قبل/بعد) به‌جای نوسان availMem

            ### 🛡️ برنامه‌های پرخطر و کش واقعی
            - مجوزهای حافظه/رسانه (READ_MEDIA_*) در تحلیل حساب می‌شوند: برنامه‌ای که به آن حافظه داده‌اید (مثل تلگرام) با دلیل دقیق فارسی و سطح‌بندی ۴ مرحله‌ای صادقانه (بسیار بالا/بالا/متوسط/پایین) نمایش داده می‌شود
            - اسکنر کش: بررسی دسترسی «آمار مصرف» + کارت راهنما به‌جای خطای بی‌صدا + کل داده هر برنامه کنار کش

            ### 📚 هوش فایل و هوش بات (آموزش واقعی)
            - پایگاه‌دانش ۱۹ قانونی هوش فایل + ۵۰ قانون هوش بات — همه واقعی، فارسی و کاربردی (بدون ادعای الکی)
            - نکته زمینه‌ای زنده بر اساس نتایج اسکن خود دستگاه + تحلیل چندسطحی باتری + چیپ‌های آمار زنده

            ### 🎬 گالری رسانه: پخش ویدیو + زوم تصویر
            - **پراکسی رسانه Range (206):** ویدیوهای content:// حالا واقعاً داخل اپ پخش می‌شوند (با seek) — قبلاً پخش نمی‌شدند
            - **زوم حرفه‌ای تصویر:** دابل‌تپ، پینچ، اسکرول و نوار زوم SVG (+/−/ریست) از ۱۰۰٪ تا ۴۰۰٪ با پن
            - ظاهر حرفه‌ای‌تر: دکمه پخش شیشه‌ای، آیکون‌های SVG، بج‌ها و چیپ‌های جدید

            ### 🧪 کیفیت
            - **۲۸۰+ آزمون** در ۲۱ گروه (گروه‌های جدید: HARDWARE، STORAGE، MEDIA، FILEINTEL)
            - صادقانه‌ترین گزارش ممکن: هر جا اندروید اجازه نمی‌دهد، همان صادقانه گفته می‌شود — نه عدد جعلی

            ### 📲 مشخصات APK
            - **Version:** 1.0.3 (Code: 4) — **minSdk 24** — **targetSdk 34**
            - **امضا:** v1+v2+v3 با همان کلید قبلی — نصب روی نسخه‌های قبلی بدون حذف

            ### 📥 دانلود
            `https://github.com/hafgo096-ux/battery-alarm/releases/latest/download/battery-alarm.apk`
          files: app/build/outputs/apk/release/battery-alarm.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
