name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-alarm-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: نسخه ۱.۰.۰ - زنگ هشدار باتری و پایش سخت‌افزار (انتشار اولیه)
          body: |
            ## 🔋 انتشار نسخه اولیه ۱.۰.۰ (Initial Release v1.0.0)

            برنامه اختصاصی هشدار هوشمند شارژ باتری و پایش دقیق پردازنده (CPU)، حافظه رم (RAM) و حافظه داخلی (Storage) برای گوشی‌های اندروید.

            ### ✨ ویژگی‌های نسخه ۱.۰.۰:
            - 🎯 **هشدار هوشمند شارژ**: قطع هشدار فقط با دکمه توقف، جلوگیری از شارژ بیش از حد (Overcharge Protection)
            - 🧠 **پایش دقیق سخت‌افزار**: نمایش بلادرنگ درصد مصرف و مشخصات پردازنده (CPU) و تعداد هسته‌ها
            - ⚡ **مدیریت و نمایش رم (RAM)**: نمایش تفکیک‌شده حافظه رم آزاد، مصرف‌شده و کل سیستم
            - 💾 **پایش حافظه ذخیره‌سازی (Storage / ROM)**: نمایش دقیق حافظه خالی و موجود و درصد استفاده
            - 🔔 **موتور آلارم پیشرفته**: پشتیبانی از زنگ‌های متنوع، ویبره الگو دار و اعلان سیستمی
            - 🛡️ **سرویس پایدار پس‌زمینه (Foreground Service)**: کارکرد کامل حتی هنگام بستن برنامه یا خاموش بودن صفحه
            - 🎨 **رابط کاربری بازطراحی‌شده فوق‌العاده شیک**: طراحی مدرن و حرفه‌ای نئونی AMOLED با پشتیبانی کامل از زبان فارسی

            ### 📲 مشخصات فنی APK:
            - **نام فایل**: `battery-alarm.apk`
            - **پکیج**: `com.dsh.batteryalarm`
            - **حداقل اندروید**: Android 8.0 (API 26+)
            - **اندروید هدف**: Android 15 (API 35)
            - **امضا**: Release Signed (Keystore اختصاصی)
          files: app/build/outputs/apk/release/battery-alarm.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
