name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-alarm-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: نسخه ۱.۰.۱ - رفع باگ‌های گزارش‌شده + اسکنر واقعی کش و فایل (انتشار رسمی)
          body: |
            ## 🔋 نسخه ۱.۰.۱ (Version Code: 2) — رفع باگ‌های گزارش‌شده + اسکنر واقعی

            این نسخه مستقیماً به گزارش‌های کاربران پاسخ می‌دهد: بخش‌های خالی «هوش فایل» و «بهینه‌سازی» حالا **واقعاً کار می‌کنند** و کنترل‌های گمشده تنظیمات برگشتند.

            ### 🐞 باگ‌های رفع‌شده
            - **کرش راه‌اندازی (`FA_DIGITS`):** ثابت ارقام فارسی تعریف نشده بود و بیشتر صفحه‌ها فقط `—` نشان می‌دادند. رفع شد + هر مرحله راه‌اندازی ایزوله شد.
            - **کنترل‌های گمشده تنظیمات:** درصد هدف شارژ (روی ۸۵ قفل بود!)، آستانه کم‌شارژ، دمای بحرانی، فاصله ضدتکرار و ۵ کلید هشدار/ویبره/صدای فارسی برگشتند.
            - **کرش دکمه «حذف همه»** و **گزارش جعلی حذف فایل** حذف/بازنویسی شدند.
            - **تست زنگ با پایش خاموش** دیگر بلافاصله قطع نمی‌شود.
            - **هشدارهای حالت کم‌مصرف حالا صدا دارند** (پخش یک‌باره پیام فارسی).
            - فرکانس CPU (همیشه `0.00` بود)، باتری ۰٪، برچسب‌های ثابت و تب‌های فایل اصلاح شدند.

            ### 📁 اسکنر واقعی (جدید)
            - **کش واقعی برنامه‌ها** با `StorageStatsManager` (مرتب‌شده بر اساس حجم، با راهنمای گرفتن دسترسی)
            - **فایل‌های حجیم رسانه‌ای** (عکس/ویدیو بالای ۲۰ مگ) با `MediaStore`
            - **پاکسازی امن کش خود برنامه** با گزارش واقعی
            - مدیریت امن از طریق تنظیمات اندروید؛ برنامه هرگز فایل دیگران را مستقیم حذف نمی‌کند
            - فیلتر «پرخطر» سطح‌بندی شد (بسیار بالا/بالا/متوسط) با دلیل فارسی دقیق

            ### 🧪 تست و کیفیت
            - ۲۱ متد نیتیو تحت پوشش تست (قبلاً ۱۲ با تکرار)؛ SKIP درست در مرورگر؛ شمارش داینامیک تست‌ها
            - رابط کاربری تک‌منبع شد (`index.html` ریشه + تسک `syncWebUi` در بیلد)

            ### 📲 مشخصات فایل APK
            - **Application ID:** `com.persian.batteryalarm.optimizer`
            - **Version:** 1.0.1 (Version Code: 2)
            - **Key Alias:** `batteryalarm_release_alias` — **Keystore:** `batteryalarm-release-key.jks`
            - **امضا:** Release Signed (v1 + v2 + v3) — با همان امضای ۱.۰.۰ (نصب بدون حذف نسخه قبلی)
            - **minSdk:** API 24 (اندروید ۷) — **targetSdk:** 34

            ### 📥 لینک دانلود همیشه به‌روز
            `https://github.com/hafgo096-ux/battery-alarm/releases/latest/download/battery-alarm.apk`
          files: app/build/outputs/apk/release/battery-alarm.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
