name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set -o pipefail
          if gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; then
            echo "BUILD OK"
          else
            {
              echo "## 🔥 CI build failure (run ${{ github.run_id }})"
              echo "### What went wrong"
              echo '```'
              grep -n "What went wrong" -A 25 /tmp/build.log | head -60 || true
              echo '```'
              echo "### compile errors (اولین ۴۰ مورد)"
              echo '```'
              grep -n -A 4 "error:" /tmp/build.log | head -80 || true
              echo '```'
              echo "### Caused by"
              echo '```'
              grep -n "Caused by" -A 2 /tmp/build.log | head -40 || true
              echo '```'
              echo "### خطوط ۱۰۰ تا ۲۰۰ لاگ"
              echo '```'
              sed -n '100,200p' /tmp/build.log || true
              echo '```'
              echo "log lines: $(wc -l < /tmp/build.log)"
            } > /tmp/body.md
            gh issue create --title "CI build log (run ${{ github.run_id }})" --body-file /tmp/body.md || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-alarm-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: نسخه ۱.۰.۴ — رفع قطعی پخش ویدیو (API عمومی)، ۳۵ آموزش هوش فایل، اندازه‌گیری صادقانه بهینه‌سازی
          body: |
            ## 🔋 نسخه ۱.۰.۴ (Version Code: 5) — تکمیل و سخت‌سازی نسخه ۱.۰.۳

            ### 🎬 رفع قطعی پخش ویدیو در همه دستگاه‌ها (تکمیل ۱.۰.۳)
            - هدرهای `Content-Range`/`Content-Length` حالا از **سازنده عمومی ۶ آرگومانی** `WebResourceResponse` ست می‌شوند (روش قبلی `setResponseHeaders` API مخفی اندروید است و روی اندروید ۹+ با targetSdk جدید ممکن است در زمان اجرا شکست بخورد)
            - `Content-Length` پاسخ‌های 206 حالا طول **بخش** است نه کل فایل (اشکال در seek)
            - استریم رسانه با `AutoCloseInputStream` (مالکیت امن fd؛ بدون race بسته‌شدن زودهنگام)
            - رفع بازه `bytes=0-0` (بایت اول ویدیو)

            ### 📚 هوش فایل — ۳۵ آموزش واقعی + کتابخانه قابل مرور
            - پایگاه‌دانش از ۱۹ به **۳۵ قانون کاربردی** (کش، رسانه، حافظه، مجوزها، مدیریت کلی) — واقعی و بدون توصیه الکی
            - **کتابخانه آموزش‌ها** در تب هوش فایل: دسته‌بندی‌دار با آیکون SVG + نمایش تدریجی

            ### ⚡ بهینه‌سازی و سخت‌افزار
            - `optimizeRam`: نمونه‌برداری دومرحله‌ای قبل/بعد، هرگز عدد منفی، گزارش رم قبل/بعد و رم استفاده‌شده
            - دمای پردازنده با دقت اعشار (۴۲.۵°) + بررسی تا ۳۲ thermal zone + فیلد `temperatureSource`

            ### 🛠 سازگاری WebView
            - رفع کرش `play()/exitFullscreen()` در WebViewهای قدیمی (Promise نبودن)

            ### 🧪 کیفیت
            - **۲۹۸ آزمون داخل اپ** (همه پاس) + **۳۱ تست دودی DOM** با پل نیتیو ماک برای همه بخش‌ها

            ### 📲 مشخصات APK
            - **Version:** 1.0.4 (Code: 5) — **minSdk 24** — **targetSdk 34**
            - **امضا:** v1+v2+v3 با همان کلید قبلی — نصب روی نسخه‌های قبلی بدون حذف

            ### 📥 دانلود
            `https://github.com/hafgo096-ux/battery-alarm/releases/latest/download/battery-alarm.apk`
          files: app/build/outputs/apk/release/battery-alarm.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close CI build log issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          NUMS=$(gh issue list --state open --json number,title -q '.[] | select((.title | startswith("CI build log")) or (.title | startswith("cleanup-failed"))) | .number')
          echo "found: [$NUMS]"
          for n in $NUMS; do
            if gh issue close "$n" --reason completed > /tmp/close_out.log 2>&1; then
              echo "closed $n ✓"
            else
              { echo "close issue $n failed:"; echo '```'; cat /tmp/close_out.log; echo '```'; } > /tmp/body.md
              gh issue create --title "cleanup-failed (run ${{ github.run_id }})" --body-file /tmp/body.md || true
            fi
          done
