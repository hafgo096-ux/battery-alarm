name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-alarm-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: نسخه ۱.۰.۰ - زنگ هشدار باتری، بهینه‌ساز رم و هوش مصنوعی (انتشار رسمی)
          body: |
            ## 🔋 انتشار نسخه اولیه ۱.۰.۰ (Initial Release v1.0.0)

            برنامه هوشمند زنگ هشدار شارژ باتری، پایش پیشرفته سخت‌افزار (CPU, RAM, ROM, Battery)، بهینه‌سازی حافظه رم و هوش مصنوعی تشخیص فایل‌های زائد و برنامه‌های پرخطر.

            ### ✨ ویژگی‌ها و تغییرات اعمال‌شده:
            - 🔇 **رفع کامل باگ بی‌صدا شدن هشدارها**: پیاده‌سازی موتور صوتی ۳ لایه با صدای گوینده فارسی، ملودی زنگ و بیزر اضطراری
            - 🗣️ **هشدارهای صوتی فارسی (Persian Voice Alerts)**: اعلام شارژ هدف (۸۵٪)، شارژ کامل (۱۰۰٪)، کمبود شارژ (۲۰٪)، دمای بحرانی و تایید بهینه‌سازی
            - 🧠 **معماری هوش مصنوعی اسکن فایل‌ها و برنامه‌ها**:
              - شناسایی فایل‌های تکراری با الگوریتم تطبیق هش و تفکیک فایل اصلی از کپی
              - شناسایی فایل‌های اضافی و کَش سیستمی
              - شناسایی فایل‌های غیرضروری و کم‌اهمیت
              - شناسایی فایل‌ها و برنامه‌های پرخطر با دسترسی‌های مشکوک
              - دکمه حذف اختصاصی برای هر فایل + دکمه «حذف همه» در هر بخش
              - **امنیت کامل**: عدم حذف خودسرانه توسط هوش مصنوعی و نیاز قطعی به تایید دستی کاربر
            - ⚡ **بخش اختصاصی بهینه‌سازی رم (RAM Optimizer)**:
              - شناسایی فرآیندهای پس‌زمینه و پروسس‌های اشغال‌کننده رم
              - امکان انتخاب گزینشی موارد با چک‌باکس
              - آزادسازی فوری رم پس از تایید کاربر و گزارش میزان مگابایت آزاد شده
            - 💡 **معماری هوش مشاور (AI Advisor)**: ارائه توصیه‌های هوشمند بلادرنگ در هر بخش
            - 🛡️ **پایش دقیق سخت‌افزار**: نمایش لود پردازنده به تفکیک هسته‌ها، مشخصات کامل، سلامت باتری، دما و ولتاژ
            - 🧹 **حذف کامل منوی بررسی نسخه و دانلود از داخل برنامه**: رابط کاربری تمیز و بدون هیچ‌گونه لینک یا پاپ‌آپ نسخه داخلی

            ### 📲 مشخصات فنی و امضای فایل APK:
            - **Application ID**: `com.persian.batteryalarm.optimizer`
            - **Version**: 1.0.0 (Version Code: 1)
            - **Key Alias**: `batteryalarm_release_alias`
            - **Keystore**: `batteryalarm-release-key.jks`
            - **امضا**: Release Signed (v1 + v2 + v3)
          files: app/build/outputs/apk/release/battery-alarm.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
