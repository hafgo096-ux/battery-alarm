name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-alarm-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: نسخه ۱.۰.۰ - زنگ هشدار باتری، بهینه‌ساز رم و هوش مصنوعی (انتشار رسمی)
          body: |
            ## 🔋 نسخه ۱.۰.۰ (Version Code: 1) — ویرایش فنی: رفع باگ‌ها، کنترل صدا و مصرف کمینه باتری

            نسخه پروژه همان **۱** باقی ماند؛ فقط کد اصلاح و بهینه شد.

            ### 🐞 باگ‌های رفع‌شده (مهم‌ترین‌ها)
            - **فراموش شدن تنظیمات:** رابط کاربری با `file://` بارگذاری می‌شد و `localStorage` در WebView اندروید روی این اسکیم مسدود است؛ هیچ مسیر بازخوانی هم وجود نداشت. اکنون صفحه از دامنه امن داخلی `appassets.androidplatform.net` سرو می‌شود و همه تنظیمات در `SharedPreferences` ذخیره و در هر اجرا بازخوانی می‌شوند (کلید `MonitorPrefs`).
            - **اعتبارسنجی مقادیر:** هدف ۵۰–۱۰۰، کم‌شارژ ۵–۵۰، دما ۳۵–۶۰، بلندی صدا ۰–۱۰۰، توقف خودکار ۰–۱۲۰ ثانیه.
            - **صداقت داده:** حذف اعداد تصادفی رم (`Math.random`) و داده‌های ساختگی سخت‌افزار؛ حذف فایل ناموجود دیگر «موفق» گزارش نمی‌شود.
            - **مجموعه تست واقعی:** مجموعه نمایشی «۱۰۰ تست» حذف و با **۲۰۰+ آزمون واقعی** (BRIDGE/SETTINGS/PERSIST/VALIDATION/VOLUME/BATTERY/POWER/UI/DATA/PERF) جایگزین شد.
            - **امنیت و کیفیت:** حذف `WAKE_LOCK`، `SCHEDULE_EXACT_ALARM`، `USE_EXACT_ALARM` و `READ/WRITE_EXTERNAL_STORAGE`، بستن دسترسی‌های باز WebView و رفع نشتی حافظه WebView.

            ### 🔊 قابلیت جدید: کنترل بلندی صدای هشدار
            - اسلایدر ۰ تا ۱۰۰٪ + پیش‌تنظیم ۰/۵۰/۱۰۰ + نمایش زنده مقدار
            - دکمه «تست زنگ با این بلندی» (۶ ثانیه و توقف خودکار)
            - سوییچ اختیاری «اعمال روی بلندی زنگ گوشی» (کانال `STREAM_ALARM`)
            - توقف خودکار زنگ (۱۵/۳۰/۴۵/۶۰/۱۲۰ ثانیه یا دستی) و سوییچ آژیر حلقه‌ای
            - بی‌صدا کردن از هدر اپ با بازیابی آخرین بلندی پس از اجرای مجدد

            ### 🔋 مصرف باتری (پاسخ به نگرانی اصلی)
            بله، نسخه اولیه می‌توانست باتری را محسوس مصرف کند. این موارد رفع شد:
            - حذف کامل **WakeLock دائمی بدون timeout** و **Timer نگهبان هر ۶۰ ثانیه**
            - حذف `setKeepScreenOn(true)` (نمایشگر آزادانه خاموش می‌شود)
            - پایش **رویدادمحور** با `ACTION_BATTERY_CHANGED` + کش‌گذاری (`CPU ۱.۵s`، رم `۱.۲s`، حافظه `۴s`)
            - توقف کامل تایمرهای JS در پس‌زمینه (`pauseTimers` + `visibilitychange`)
            - **حالت کم‌مصرف (Ultra Saver):** بدون سرویس دائمی، بررسی هر ۱۵ دقیقه با Job
            - **کلید خاموش کردن کامل پایش:** مصرف صفر
            - درخواست معافیت باتری فقط یک‌بار

            ### 📲 مشخصات فایل APK
            - **Application ID:** `com.persian.batteryalarm.optimizer`
            - **Version:** 1.0.0 (Version Code: 1)
            - **Key Alias:** `batteryalarm_release_alias` — **Keystore:** `batteryalarm-release-key.jks`
            - **امضا:** Release Signed (v1 + v2 + v3)
            - **minSdk:** API 24 (اندروید ۷) — **targetSdk:** 34

            ### 📥 لینک دانلود همیشه به‌روز
            `https://github.com/hafgo096-ux/battery-alarm/releases/latest/download/battery-alarm.apk`
          files: app/build/outputs/apk/release/battery-alarm.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
