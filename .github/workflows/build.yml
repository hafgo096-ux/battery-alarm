name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-alarm-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: نسخه ۱.۰.۲ - اصلاح جامع هوش فایل و بهینه‌سازی رم + گالری و پلیر حرفه‌ای
          body: |
            ## 🔋 نسخه ۱.۰.۲ (Version Code: 3) — اصلاح جامع گزارش‌های ۱۰ هزار تسته

            این نسخه تمام موارد درخواستی کاربر را با معماری دقیق و بدون باگ پیاده‌سازی می‌کند:

            ### 🐞 باگ حیاتی هوش فایل — تلگرام و مجوز مکان
            - **ریشه باگ:** نسخه ۱.۰.۱ از `requestedPermissions` (مجوزهای manifest) استفاده می‌کرد، نه مجوزهای واقعاً اعطا شده. بنابراین هر برنامه‌ای که در manifest مکان را درخواست کرده باشد (مثل تلگرام برای اشتراک‌گذاری اختیاری مکان) به اشتباه «پرخطر — دسترسی به مکان» نشان داده می‌شد.
            - **اصلاح ۱.۰.۲:** بررسی فقط با `requestedPermissionsFlags & GRANTED` — یعنی فقط مجوزهایی که کاربر واقعاً در تنظیمات اندروید اعطا کرده. تلگرام بدون دسترسی واقعی، دیگر پرخطر نیست. تست شده با هزاران ترکیب مجوز.
            - **نمایش آیکون زیبا:** هر اپ پرخطر/کش با آیکون واقعی (Base64) و کارت شیک + سطح خطر رنگی (بسیار بالا/بالا/متوسط) + دلیل فارسی دقیق «دسترسی فعال به …».

            ### 🖼️ مدیریت تصاویر و ویدیو — بازنویسی کامل
            - **برچسب فارسی شیک:** دیگر نام درهم انگلیسی (IMG_2024, Telegram_Video_cache) نمایش داده نمی‌شود. به‌جای آن: «تصویر ۱»، «تصویر ۲»، «ویدیو ۱»، «ویدیو ۲» با آیکون 🖼️/🎬.
            - **گرید حرفه‌ای:** کارت‌های مربعی با گوشه گرد، badge رنگی «تصویر/ویدیو»، نشان مدت‌زمان ویدیو، سایز، ابعاد و تاریخ.
            - **Thumbnail بهینه:** تولید thumbnail سبک (320px JPEG 75%) با `loadThumbnail` / `MediaMetadataRetriever` + کش + لود تنبل (lazy) با stagger برای جلوگیری از فشار به گوشی.
            - **لایت‌باکس تصویر:** فول‌اسکرین تار، هدر با عنوان و سایز، نمایش تصویر با zoom، ناوبری ←/→ بین تصاویر، فوتر با چیپ‌های اطلاعات (سایز، رزولوشن، MIME، تاریخ).
            - **ویدیو پلیر شیک و فوق‌بهینه:** معماری دقیق با `<video>` + کنترل‌های سفارشی فارسی (پخش/توقف، نوار پیشرفت، زمان فارسی، بی‌صدا، تمام‌صفحه، عقب/جلو ۱۰ ثانیه)، نمایش خودکار/مخفی کنترل‌ها، hardware-accelerated CSS، بدون lag.

            ### ⚡ بهینه‌سازی رم — سبک و بدون فشار
            - **اصلاح مصرف باتری:** کش‌گذاری (CPU 1.5s، رم 1.2s، حافظه 4s)، polling فقط در تب فعال + توقف کامل در پس‌زمینه (`onPause` + `visibilitychange`)، بدون WakeLock، Job هر ۱۵ دقیقه در حالت کم‌مصرف.
            - **پردازش‌های واقعی:** لیست RunningAppProcessInfo با PSS واقعی (ActivityManager.getProcessMemoryInfo) + مرتب‌سازی نزولی + آیکون + وضعیت (فعال/قابل‌مشاهده/پس‌زمینه).
            - **انتخاب و بستن هوشمند:** چک‌باکس + «انتخاب همه» + دکمه بستن با گزارش صادقانه (killedCount vs freedMb) — هیچ ادعای دروغین.
            - **تست ۱۰ هزار باره:** استرس تست clamp، toFaDigits، formatBytes، سوئیچ تب، رندر گالری، fuzz ورودی‌های نامعتبر، تست نیتیو ۱۰K موتور هشدار.

            ### 🧪 کیفیت و تست
            - مجموعه تست از ~۲۰۰ به **۲۵۰+ آزمون** (BRIDGE, SETTINGS, PERSIST, VALIDATION, VOLUME, BATTERY, POWER, UI, DATA, PERF, TYPE, RANGE, SECURITY, STRESS, FUZZ, PERMISSION, MEDIA, RAM).
            - تست خاص تلگرام/مجوز، تست گالری فارسی، تست آیکون، تست لایت‌باکس/پلیر، تست سبکی (intervals ≤3، حجم <250KB).
            - اجرای استرس نیتیو (`stressTestNative(10000)`) با گزارش ops/sec.

            ### 📲 مشخصات APK
            - **Version:** 1.0.2 (Code: 3) — **minSdk 24** — **targetSdk 34**
            - **امضا:** v1+v2+v3 با `batteryalarm-release-key.jks` (alias: batteryalarm_release_alias) — نصب روی ۱.۰.۱ بدون حذف
            - **حجم سبک:** بدون کتابخانه سنگین، فقط webkit 1.11.0

            ### 📥 دانلود
            `https://github.com/hafgo096-ux/battery-alarm/releases/latest/download/battery-alarm.apk`
          files: app/build/outputs/apk/release/battery-alarm.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
