plugins {
    id 'com.android.application'
}

android {
    namespace 'com.persian.batteryalarm.optimizer'
    compileSdk 34

    defaultConfig {
        applicationId "com.persian.batteryalarm.optimizer"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.0.3"
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    androidResources {
        noCompress 'mp3'
    }

    signingConfigs {
        release {
            storeFile file("batteryalarm-release-key.jks")
            storePassword "BatteryAlarm@ReleasePass2025!"
            keyAlias "batteryalarm_release_alias"
            keyPassword "BatteryAlarm@ReleasePass2025!"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = false
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    applicationVariants.all { variant ->
        if (variant.name == 'release') {
            variant.outputs.each { output ->
                output.outputFileName = "battery-alarm.apk"
            }
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// تک‌منبع رابط کاربری (نسخه ۱.۰.۲): فایل index.html ریشه ریپو، مرجع واحد است و
// پیش از هر بیلد داخل assets کپی می‌شود تا نسخه‌های ناهماهنگ ساخته نشود.
tasks.register('syncWebUi', Copy) {
    from rootProject.file('index.html')
    into layout.projectDirectory.dir('src/main/assets')
}

tasks.named('preBuild') {
    dependsOn('syncWebUi')
}
