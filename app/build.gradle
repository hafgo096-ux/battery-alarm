plugins {
    id 'com.android.application'
}

android {
    namespace 'com.persian.batteryalarm.optimizer'
    compileSdk 34

    defaultConfig {
        applicationId "com.persian.batteryalarm.optimizer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    aaptOptions {
        noCompress 'mp3'
    }

    signingConfigs {
        release {
            storeFile file("batteryalarm-release-key.jks")
            storePassword "BatteryAlarm@ReleasePass2025!"
            keyAlias "batteryalarm_release_alias"
            keyPassword "BatteryAlarm@ReleasePass2025!"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = false
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        if (variant.name == 'release') {
            variant.outputs.each { output ->
                output.outputFileName = "battery-alarm.apk"
            }
        }
    }
}
